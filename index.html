<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Nelikvid Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { margin: 0; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background:#f5f5f5; }
    .app { display:grid; grid-template-columns:260px 1fr; min-height:100vh; }
    .sidebar { background:#ffffff; border-right:1px solid #ddd; padding:20px; }
    .main { padding:20px; }
    h1 { font-size:18px; margin:0 0 4px; }
    .muted { font-size:12px; color:#777; margin-bottom:20px; }
    .kpi-grid { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:12px; margin-bottom:20px; }
    .card { background:#ffffff; border:1px solid #ddd; border-radius:10px; padding:12px 14px; }
    .kpi-label { font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:#777; margin-bottom:4px; }
    .kpi-value { font-size:18px; font-weight:600; }
    .charts { display:grid; grid-template-columns:1.3fr 1fr; gap:16px; margin-bottom:20px; }
    table { width:100%; border-collapse:collapse; font-size:12px; }
    th,td { padding:6px 8px; border-bottom:1px solid #e0e0e0; text-align:left; }
    th { font-size:10px; text-transform:uppercase; color:#777; }
    .filters { display:flex; flex-wrap:wrap; gap:8px; margin:10px 0; }
    input, select { padding:6px 8px; font-size:12px; border-radius:6px; border:1px solid #ccc; }
    .status { padding:4px 8px; border-radius:999px; font-size:10px; }
    .s0 { background:rgba(67,122,34,.12); color:#2e6a1b; }
    .s1 { background:rgba(1,105,111,.12); color:#015a5f; }
    .s2 { background:rgba(161,44,123,.12); color:#8a275d; }
    @media (max-width: 900px) {
      .app { grid-template-columns:1fr; }
      .sidebar { position:relative; height:auto; }
      .charts { grid-template-columns:1fr; }
      .kpi-grid { grid-template-columns:repeat(2,minmax(0,1fr)); }
    }
  </style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <h1>Nelikvid Dashboard</h1>
    <div class="muted">Парсинг Excel из 1С</div>
    
    <div style="margin-bottom:16px; border-bottom:1px solid #ddd; padding-bottom:12px;">
      <div style="font-size:11px; text-transform:uppercase; color:#777; margin-bottom:8px;">Файл остатков</div>
      <input type="file" id="fileStock" accept=".xls,.xlsx" style="width:100%; box-sizing:border-box;" />
    </div>

    <div style="margin-bottom:16px; border-bottom:1px solid #ddd; padding-bottom:12px;">
      <div style="font-size:11px; text-transform:uppercase; color:#777; margin-bottom:8px;">Файл продаж</div>
      <input type="file" id="fileSales" accept=".xls,.xlsx" style="width:100%; box-sizing:border-box;" />
    </div>

    <div style="margin-bottom:16px; border-bottom:1px solid #ddd; padding-bottom:12px;">
      <div style="font-size:11px; text-transform:uppercase; color:#777; margin-bottom:8px;">Неликвиды РОПа</div>
      <input type="file" id="fileRop" accept=".xls,.xlsx" style="width:100%; box-sizing:border-box;" />
    </div>

    <button id="btnProcess" style="width:100%; padding:8px; margin-bottom:8px; background:#007acc; color:#fff; border:none; border-radius:6px; cursor:pointer; font-size:12px; font-weight:500;">
      Обработать
    </button>

    <button id="btnDownload" style="width:100%; padding:8px; background:#28a745; color:#fff; border:none; border-radius:6px; cursor:pointer; font-size:12px; font-weight:500;" disabled>
      Скачать отчёт
    </button>

    <div id="uploadStatus" style="margin-top:12px; font-size:11px; color:#666;"></div>
  </aside>

  <main class="main">
    <div class="kpi-grid" id="kpis"></div>

    <div class="charts">
      <div class="card">
        <div class="kpi-label">По складам</div>
        <canvas id="skladChart"></canvas>
      </div>
      <div class="card">
        <div class="kpi-label">Статусы позиций</div>
        <canvas id="statusChart"></canvas>
      </div>
    </div>

    <div class="card" style="margin-bottom:10px;">
      <div class="kpi-label">По брендам (топ по остатку)</div>
      <canvas id="brandChart" height="220"></canvas>
    </div>

    <div class="card">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
        <div class="kpi-label">Детальная таблица</div>
        <div id="countInfo" class="muted"></div>
      </div>
      <div class="filters">
        <input id="search" placeholder="Поиск по наименованию" />
        <select id="skladFilter"><option value="">Все склады</option></select>
        <select id="brandFilter"><option value="">Все бренды</option></select>
        <select id="statusFilter"><option value="">Все статусы</option></select>
      </div>
      <div style="max-height:420px; overflow:auto;">
        <table>
          <thead>
          <tr>
            <th>Наименование</th>
            <th>Бренд</th>
            <th>Склад</th>
            <th>Код</th>
            <th>Ширина</th>
            <th>Остаток</th>
            <th>Продажи, шт</th>
            <th>Статус</th>
          </tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="app.js"></script>
</body>
</html>
